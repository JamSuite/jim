# jim project configuration — zero-config defaults apply for every unset key
# (see jimconf.toml.example for the full key reference).

# The partition extractor registry: jim's dependency channels are markdown and
# bash references, which the native import scan does not model. This adapter
# emits them on the ingest line contract; /jim:partition runs it via a normal
# Bash permission prompt and validates every edge through jimpartition.sh
# ingest. This config entry is the only activation channel for the command.
deps_command_refs = "bash scripts/jim-deps-refs.sh"
