# jim project configuration — zero-config defaults apply for every unset key
# (see jimconf.toml.example for the full key reference).

# --- Security gates
require_security = "true"
auto_security = "true"
require_security_loop = "true"

# --- Issues
id_coordination_unreachable = "provisional"

# --- Reviews
require_review = "true"
auto_review = "true"
review_model = "sonnet"
review_fanout_cap = "20"

# --- Blueprints
require_blueprint = "true"
blueprint_regen_threshold = "5"
require_health = "true"
auto_health = "true"
deps_command_refs = "bash scripts/jim-deps-refs.sh"
verify_model = "sonnet"
verify_fanout_cap = "20"
verify_command_id-sweep = "bash skills/file/scripts/jimalloc.sh sweep"
