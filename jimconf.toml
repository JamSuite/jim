# jim project configuration — zero-config defaults apply for every unset key
# (see jimconf.toml.example for the full key reference).

# The partition extractor registry: jim's dependency channels are markdown and
# bash references, which the native import scan does not model. This adapter
# emits them on the ingest line contract; /jim:partition runs it via a normal
# Bash permission prompt and validates every edge through jimpartition.sh
# ingest. This config entry is the only activation channel for the command.
deps_command_refs = "bash scripts/jim-deps-refs.sh"

# The operator command behind the platform blueprint's registry-tree-consistency
# invariant: /jim:verify resolves this name, runs the string verbatim, and maps
# exit 0 to holds and any clean non-zero to violated. The sweep is read-only and
# its exit codes are designed for that mapping — 3 (drift) is exactly a
# violation, and 4 (could not check) reports as one too, loudly, with the report
# naming the degradation.
verify_command_id-sweep = "bash skills/file/scripts/jimalloc.sh sweep"

# When the ID-coordination point is unreachable, hand back a local provisional
# identifier instead of hard-failing, so coordinated work continues offline and
# settles later via `/jim:issue reconcile`. Suited to a sandbox/agent clone with
# no push credentials for the coordination remote.
id_coordination_unreachable = "provisional"
